<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="Super Simon — The ultimate memory challenge. Classic Simon reinvented with modes, stats, neon vibes and buttery animations." />
  <title>Super Simon — Ultimate Memory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">◆</span>
        <h1>SUPER<span>SIMON</span></h1>
      </div>
      <div class="header-controls">
        <button id="btn-sound" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">
          <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">LEVEL</span>
        <span id="level" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">SCORE</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">BEST</span>
        <span id="best" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">STREAK</span>
        <span id="streak" class="stat-value">0</span>
      </div>
    </div>

    <!-- Mode Selector (visible when idle) -->
    <div id="mode-panel" class="mode-panel">
      <h2>Choose Your Challenge</h2>
      <div class="mode-grid">
        <button class="mode-card active" data-mode="classic">
          <span class="mode-icon">🎯</span>
          <span class="mode-name">Classic</span>
          <span class="mode-desc">Repeat the sequence</span>
        </button>
        <button class="mode-card" data-mode="reverse">
          <span class="mode-icon">🔄</span>
          <span class="mode-name">Reverse</span>
          <span class="mode-desc">Repeat it backwards</span>
        </button>
        <button class="mode-card" data-mode="speed">
          <span class="mode-icon">⚡</span>
          <span class="mode-name">Speed</span>
          <span class="mode-desc">Faster every round</span>
        </button>
        <button class="mode-card" data-mode="chaos">
          <span class="mode-icon">🌀</span>
          <span class="mode-name">Chaos</span>
          <span class="mode-desc">Colors shuffle mid-game</span>
        </button>
      </div>
      <div class="difficulty-row">
        <label>Difficulty</label>
        <div class="diff-buttons">
          <button class="diff-btn" data-diff="1">Easy</button>
          <button class="diff-btn active" data-diff="2">Normal</button>
          <button class="diff-btn" data-diff="3">Hard</button>
          <button class="diff-btn" data-diff="4">Insane</button>
        </div>
      </div>
      <button id="btn-start" class="btn-primary">
        <span>START GAME</span>
        <kbd>Space</kbd>
      </button>
    </div>

    <!-- Game Board -->
    <div id="board-container" class="board-container hidden">
      <div class="status-text" id="status">Watch the sequence...</div>
      <div class="progress-track">
        <div id="progress" class="progress-fill"></div>
      </div>
      <div id="board" class="board">
        <button class="pad green" data-color="green" aria-label="Green"></button>
        <button class="pad red" data-color="red" aria-label="Red"></button>
        <button class="pad yellow" data-color="yellow" aria-label="Yellow"></button>
        <button class="pad blue" data-color="blue" aria-label="Blue"></button>
        <div class="center-hub">
          <div class="hub-inner">
            <span id="hub-level">1</span>
          </div>
        </div>
      </div>
      <div class="game-actions">
        <button id="btn-restart" class="btn-secondary">Restart</button>
        <button id="btn-quit" class="btn-ghost">Quit</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover" class="overlay hidden">
      <div class="overlay-card">
        <div class="go-emoji" id="go-emoji">💥</div>
        <h2 id="go-title">Game Over</h2>
        <p id="go-message">You reached level <strong id="go-level">0</strong></p>
        <div class="go-stats">
          <div><span>Score</span><strong id="go-score">0</strong></div>
          <div><span>Best</span><strong id="go-best">0</strong></div>
        </div>
        <div class="go-actions">
          <button id="btn-play-again" class="btn-primary">Play Again</button>
          <button id="btn-menu" class="btn-secondary">Main Menu</button>
        </div>
      </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings" class="overlay hidden">
      <div class="overlay-card settings-card">
        <h2>Settings</h2>
        <div class="setting-row">
          <label for="vol-slider">Master Volume</label>
          <input type="range" id="vol-slider" min="0" max="100" value="70" />
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="chk-strict" checked />
            Strict Mode <small>(mistake = game over)</small>
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="chk-particles" checked />
            Particle Effects
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="chk-vibration" checked />
            Haptic Feedback
          </label>
        </div>
        <div class="setting-row">
          <button id="btn-reset-stats" class="btn-ghost danger">Reset High Scores</button>
        </div>
        <button id="btn-close-settings" class="btn-primary">Done</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Built for the ultimate memory challenge · Open source</p>
      <p class="tips">Tip: Use <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> or arrow keys to play</p>
    </footer>
  </div>

  <canvas id="particles"></canvas>
  <script src="script.js"></script>
</body>
</html>
