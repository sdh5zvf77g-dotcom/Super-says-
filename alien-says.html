<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alien Says">
  <link rel="icon" type="image/png" href="alien-icon-192.png">
  <link rel="apple-touch-icon" href="alien-icon-512.png">
  <link rel="manifest" href="manifest.json">
  <title>Alien Says</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    :root {
      --bg: #05050a;
      --panel: #0d0d15;
      --glow-green: #39ff14;
      --glow-cyan: #00f0ff;
      --glow-magenta: #ff00aa;
      --glow-yellow: #ffe600;
      --text: #e0ffe0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(ellipse at center, #0a0a18 0%, #000 70%);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Stars background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 160px 20px, #fff, transparent);
      background-size: 200px 100px;
      animation: twinkle 8s linear infinite;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      from { transform: translateY(0); }
      to { transform: translateY(-100px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Header / Logo */
    header {
      text-align: center;
      margin-bottom: 4px;
    }

    .logo-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1a3a1a, #0a1a0a);
      border: 3px solid var(--glow-green);
      box-shadow:
        0 0 20px var(--glow-green),
        0 0 40px rgba(57,255,20,0.4),
        inset 0 0 20px rgba(57,255,20,0.2);
      overflow: hidden;
      animation: logoPulse 3s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 20px var(--glow-green), 0 0 40px rgba(57,255,20,0.3); }
      50% { box-shadow: 0 0 30px var(--glow-green), 0 0 60px rgba(57,255,20,0.6); }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--glow-green), var(--glow-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(57,255,20,0.5);
      margin-bottom: 2px;
    }

    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: #6a9a6a;
      letter-spacing: 1px;
    }

    /* HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
      font-family: 'Share Tech Mono', monospace;
    }

    .hud-box {
      flex: 1;
      background: var(--panel);
      border: 1px solid rgba(57,255,20,0.25);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: 0 0 12px rgba(57,255,20,0.1);
    }

    .hud-label {
      font-size: 0.65rem;
      color: #5a8a5a;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .hud-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--glow-green);
      text-shadow: 0 0 8px var(--glow-green);
    }

    /* Game board */
    .board {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 8px 0;
    }

    .pad {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.12s ease;
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }

    .pad::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
      pointer-events: none;
    }

    .pad::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    /* Positions */
    .pad-green  { top: 0; left: 0; background: linear-gradient(145deg, #1a6b1a, #0d3d0d); }
    .pad-red    { top: 0; right: 0; background: linear-gradient(145deg, #6b1a1a, #3d0d0d); }
    .pad-yellow { bottom: 0; left: 0; background: linear-gradient(145deg, #6b6b1a, #3d3d0d); }
    .pad-blue   { bottom: 0; right: 0; background: linear-gradient(145deg, #1a1a6b, #0d0d3d); }

    /* Active / lit states */
    .pad.active, .pad.lit {
      transform: scale(0.96) translateY(2px);
      box-shadow: 0 0 0 0 transparent;
    }

    .pad-green.active, .pad-green.lit {
      background: linear-gradient(145deg, #39ff14, #1aff00);
      box-shadow: 0 0 30px #39ff14, 0 0 60px rgba(57,255,20,0.6), inset 0 0 20px rgba(255,255,255,0.3);
      border-color: #aaffaa;
    }
    .pad-red.active, .pad-red.lit {
      background: linear-gradient(145deg, #ff2a2a, #ff0000);
      box-shadow: 0 0 30px #ff2a2a, 0 0 60px rgba(255,42,42,0.6), inset 0 0 20px rgba(255,255,255,0.3);
      border-color: #ffaaaa;
    }
    .pad-yellow.active, .pad-yellow.lit {
      background: linear-gradient(145deg, #ffe600, #ffcc00);
      box-shadow: 0 0 30px #ffe600, 0 0 60px rgba(255,230,0,0.6), inset 0 0 20px rgba(255,255,255,0.3);
      border-color: #ffffaa;
    }
    .pad-blue.active, .pad-blue.lit {
      background: linear-gradient(145deg, #00f0ff, #0088ff);
      box-shadow: 0 0 30px #00f0ff, 0 0 60px rgba(0,240,255,0.6), inset 0 0 20px rgba(255,255,255,0.3);
      border-color: #aaffff;
    }

    .pad:active:not(.disabled) {
      transform: scale(0.94) translateY(3px);
    }

    .pad.disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    /* Center alien button / status */
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1a2a1a, #050a05);
      border: 3px solid var(--glow-green);
      box-shadow:
        0 0 25px rgba(57,255,20,0.5),
        inset 0 0 15px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s;
    }

    .center:hover {
      box-shadow: 0 0 40px rgba(57,255,20,0.8), inset 0 0 15px rgba(0,0,0,0.8);
    }

    .center img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }

    .center .status-text {
      font-size: 0.55rem;
      letter-spacing: 1px;
      color: var(--glow-green);
      margin-top: 2px;
      font-family: 'Share Tech Mono', monospace;
    }

    /* Message / feedback */
    .message {
      min-height: 28px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      text-align: center;
      color: var(--glow-cyan);
      text-shadow: 0 0 10px var(--glow-cyan);
      letter-spacing: 1px;
      transition: opacity 0.3s;
    }

    .message.error {
      color: #ff4466;
      text-shadow: 0 0 10px #ff4466;
    }

    .message.success {
      color: var(--glow-green);
      text-shadow: 0 0 10px var(--glow-green);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    button.ctrl {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn-start {
      background: linear-gradient(135deg, #39ff14, #00cc00);
      color: #003300;
      box-shadow: 0 0 20px rgba(57,255,20,0.5);
    }
    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(57,255,20,0.8);
    }
    .btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sound {
      background: var(--panel);
      color: var(--glow-cyan);
      border: 1px solid rgba(0,240,255,0.4);
    }
    .btn-sound:hover {
      background: rgba(0,240,255,0.1);
    }

    .btn-reset {
      background: var(--panel);
      color: #ff6688;
      border: 1px solid rgba(255,68,102,0.4);
    }

    /* Level indicator */
    .level-bar {
      width: 100%;
      height: 6px;
      background: #1a1a22;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .level-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--glow-green), var(--glow-cyan));
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--glow-green);
    }

    /* Overlay for game over / start */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-card {
      background: linear-gradient(160deg, #0f1a0f, #0a0a12);
      border: 2px solid var(--glow-green);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 0 40px rgba(57,255,20,0.3);
    }

    .overlay-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--glow-green);
    }

    .overlay-card p {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      color: #8aba8a;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .overlay-card .score-big {
      font-size: 2.2rem;
      color: var(--glow-cyan);
      text-shadow: 0 0 15px var(--glow-cyan);
      margin: 8px 0 16px;
    }

    /* Footer tip */
    .tip {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: #3a5a3a;
      text-align: center;
      margin-top: 4px;
    }

    /* Responsive */
    @media (max-width: 380px) {
      .board { width: 270px; height: 270px; }
      .pad { width: 115px; height: 115px; }
      .center { width: 78px; height: 78px; }
      .center img { width: 44px; height: 44px; }
      h1 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-wrap">
        <img src="alien-icon.jpg" alt="Alien">
      </div>
      <h1>ALIEN SAYS</h1>
      <div class="tagline">WATCH • LISTEN • REPEAT</div>
    </header>

    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">LEVEL</div>
        <div class="hud-value" id="level">1</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">BEST</div>
        <div class="hud-value" id="best">0</div>
      </div>
    </div>

    <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>

    <div class="board" id="board">
      <div class="pad pad-green" data-color="green" id="pad-green"></div>
      <div class="pad pad-red" data-color="red" id="pad-red"></div>
      <div class="pad pad-yellow" data-color="yellow" id="pad-yellow"></div>
      <div class="pad pad-blue" data-color="blue" id="pad-blue"></div>

      <div class="center" id="centerBtn" title="Start / Status">
        <img src="alien-icon.jpg" alt="Alien">
        <div class="status-text" id="statusText">READY</div>
      </div>
    </div>

    <div class="message" id="message">Tap the alien to start</div>

    <div class="controls">
      <button class="ctrl btn-start" id="startBtn">START</button>
      <button class="ctrl btn-sound" id="soundBtn">🔊 SOUND ON</button>
      <button class="ctrl btn-reset" id="resetBtn">RESET</button>
    </div>

    <div class="tip">Add to Home Screen for the full alien experience</div>
  </div>

  <!-- Game Over Overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">GAME OVER</h2>
      <p id="overlayMsg">The aliens are not impressed...</p>
      <div class="score-big" id="overlayScore">0</div>
      <button class="ctrl btn-start" id="playAgainBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // ============ AUDIO ENGINE (Web Audio API) ============
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    const freqs = {
      green: 329.63,  // E4
      red: 261.63,    // C4
      yellow: 392.00, // G4
      blue: 220.00    // A3
    };

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(color, duration = 0.35, type = 'sine') {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freqs[color] || 300;
      gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSuccess() {
      if (!soundEnabled || !audioCtx) return;
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.12);
        osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
      });
    }

    function playError() {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    function playStartFanfare() {
      if (!soundEnabled || !audioCtx) return;
      [220, 277, 330, 440].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.08);
        osc.stop(audioCtx.currentTime + i * 0.08 + 0.25);
      });
    }

    // ============ GAME STATE ============
    const colors = ['green', 'red', 'yellow', 'blue'];
    let sequence = [];
    let playerSeq = [];
    let level = 1;
    let score = 0;
    let best = parseInt(localStorage.getItem('alienSaysBest') || '0', 10);
    let isPlaying = false;
    let isShowing = false;
    let canClick = false;

    // DOM
    const pads = {
      green: document.getElementById('pad-green'),
      red: document.getElementById('pad-red'),
      yellow: document.getElementById('pad-yellow'),
      blue: document.getElementById('pad-blue')
    };
    const levelEl = document.getElementById('level');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const messageEl = document.getElementById('message');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const soundBtn = document.getElementById('soundBtn');
    const resetBtn = document.getElementById('resetBtn');
    const centerBtn = document.getElementById('centerBtn');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMsg = document.getElementById('overlayMsg');
    const overlayScore = document.getElementById('overlayScore');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const levelFill = document.getElementById('levelFill');

    bestEl.textContent = best;

    // ============ HELPERS ============
    function setMessage(text, type = '') {
      messageEl.textContent = text;
      messageEl.className = 'message' + (type ? ' ' + type : '');
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function updateHUD() {
      levelEl.textContent = level;
      scoreEl.textContent = score;
      bestEl.textContent = best;
      // level bar roughly maps 1-20
      const pct = Math.min(100, (level / 20) * 100);
      levelFill.style.width = pct + '%';
    }

    function lightPad(color, on = true) {
      const pad = pads[color];
      if (on) pad.classList.add('lit');
      else pad.classList.remove('lit');
    }

    function flashPad(color, ms = 380) {
      return new Promise(resolve => {
        lightPad(color, true);
        playTone(color, ms / 1000);
        setTimeout(() => {
          lightPad(color, false);
          setTimeout(resolve, 120);
        }, ms);
      });
    }

    function disablePads(disabled) {
      Object.values(pads).forEach(p => {
        if (disabled) p.classList.add('disabled');
        else p.classList.remove('disabled');
      });
    }

    // ============ GAME FLOW ============
    async function showSequence() {
      isShowing = true;
      canClick = false;
      disablePads(true);
      setStatus('WATCH');
      setMessage('Alien is speaking...');
      await sleep(500);

      for (const color of sequence) {
        await flashPad(color, 420 - Math.min(level * 8, 180)); // speeds up a bit
      }

      await sleep(250);
      isShowing = false;
      canClick = true;
      disablePads(false);
      setStatus('YOUR TURN');
      setMessage('Your turn — repeat the sequence!');
      playerSeq = [];
    }

    function nextRound() {
      // Add one random color
      const next = colors[Math.floor(Math.random() * 4)];
      sequence.push(next);
      updateHUD();
      showSequence();
    }

    function handlePadClick(color) {
      if (!canClick || isShowing || !isPlaying) return;

      initAudio();
      playerSeq.push(color);
      flashPad(color, 280);

      // Check
      const idx = playerSeq.length - 1;
      if (playerSeq[idx] !== sequence[idx]) {
        // Wrong!
        canClick = false;
        playError();
        setMessage('Wrong sequence!', 'error');
        setStatus('FAIL');
        Object.values(pads).forEach(p => p.classList.add('lit'));
        setTimeout(() => {
          Object.values(pads).forEach(p => p.classList.remove('lit'));
          endGame(false);
        }, 700);
        return;
      }

      // Correct so far
      if (playerSeq.length === sequence.length) {
        // Completed round
        canClick = false;
        score += level * 10;
        if (score > best) {
          best = score;
          localStorage.setItem('alienSaysBest', best);
        }
        updateHUD();
        playSuccess();
        setMessage('Correct! Next level...', 'success');
        setStatus('GOOD');
        level++;
        setTimeout(() => {
          nextRound();
        }, 900);
      }
    }

    function startGame() {
      initAudio();
      playStartFanfare();
      sequence = [];
      playerSeq = [];
      level = 1;
      score = 0;
      isPlaying = true;
      updateHUD();
      overlay.classList.remove('show');
      startBtn.disabled = true;
      setMessage('Get ready...');
      setStatus('GO');
      setTimeout(() => nextRound(), 600);
    }

    function endGame(won = false) {
      isPlaying = false;
      canClick = false;
      disablePads(true);
      startBtn.disabled = false;

      if (won) {
        overlayTitle.textContent = 'YOU WIN!';
        overlayMsg.textContent = 'The aliens accept you as one of their own.';
      } else {
        overlayTitle.textContent = 'GAME OVER';
        overlayMsg.textContent = level > 8
          ? 'Impressive! The mothership is watching.'
          : 'The aliens are not impressed... try again!';
      }
      overlayScore.textContent = score;
      overlay.classList.add('show');
      setStatus('END');
      setMessage(won ? 'Victory!' : 'Game Over — try again');
    }

    function resetAll() {
      sequence = [];
      playerSeq = [];
      level = 1;
      score = 0;
      isPlaying = false;
      canClick = false;
      isShowing = false;
      updateHUD();
      disablePads(false);
      Object.values(pads).forEach(p => p.classList.remove('lit', 'active'));
      startBtn.disabled = false;
      overlay.classList.remove('show');
      setStatus('READY');
      setMessage('Tap the alien or START to begin');
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // ============ EVENT LISTENERS ============
    Object.entries(pads).forEach(([color, el]) => {
      el.addEventListener('click', () => handlePadClick(color));
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handlePadClick(color);
      }, { passive: false });
    });

    startBtn.addEventListener('click', startGame);
    centerBtn.addEventListener('click', () => {
      if (!isPlaying) startGame();
    });
    playAgainBtn.addEventListener('click', startGame);

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 SOUND ON' : '🔇 SOUND OFF';
      if (soundEnabled) initAudio();
    });

    resetBtn.addEventListener('click', resetAll);

    // Prevent zoom on double tap etc.
    document.addEventListener('gesturestart', e => e.preventDefault());

    // Initial
    updateHUD();
    setMessage('Tap the alien or START to begin');
  </script>
</body>
</html>
